[platformio]
default_envs = madflight-fc3v2

[env]
monitor_speed = 115200
test_framework = unity

[env:madflight-fc3v2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = solderparty_rp2350_stamp_xl
framework = arduino
board_build.core = earlephilhower
platform_packages =
    framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#832f2c0650585775270b952e49a0623079c6cd42
lib_deps =
    madflight=https://github.com/qqqlab/madflight.git#ee25367ed27fd0b1820617d624316f370616023c
build_flags =
    -std=gnu++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
    -D MF_BOARD_OVERRIDE=\"brd/madflight_FC3v2.h\"
    ; MadFlight 2.3.2's RP2350 DMA driver always reads UART0, including for
    ; UART1. Use its IRQ driver so SER1 can receive GPS data on GPIO5.
    -D MF_SERIAL_DMA=0
    -D RCL_TIMEOUT=250

[env:native]
platform = native
test_build_src = false
lib_compat_mode = off
lib_deps =
build_flags = -std=gnu++17
